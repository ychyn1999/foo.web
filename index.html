<style>
:root{--bg:#eef1f5;--fg:#1c2330;--panel:rgba(255,255,255,.88)}

:root[data-theme="dark"]{--bg:#1b2030;--fg:#e8ecf4;--panel:rgba(30,36,52,.88)}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;overflow:hidden}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#ui{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:8px;right:8px;display:flex;flex-wrap:wrap;gap:6px;z-index:2}
button{background:var(--panel);color:var(--fg);border:1px solid rgba(128,128,128,.4);border-radius:8px;padding:7px 11px;font-size:13px;cursor:pointer}
button.on{background:#2f6fed;color:#fff}
#hint{position:fixed;bottom:calc(8px + env(safe-area-inset-bottom,0px));left:8px;font-size:12px;opacity:.7}
canvas{position:fixed;left:0;top:0;z-index:1}
#css{position:fixed;left:0;top:0;z-index:0;overflow:hidden}
#sp{position:fixed;left:8px;bottom:calc(32px + env(safe-area-inset-bottom,0px));width:min(310px,calc(100vw - 16px));box-sizing:border-box;background:var(--panel);border:1px solid rgba(128,128,128,.4);border-radius:10px;padding:8px;z-index:3;font-size:12px}
#sp .r{display:flex;gap:6px;align-items:center;margin-top:4px;flex-wrap:wrap}#sp input[type=range]{width:120px}
#fp,#fs{display:none;position:fixed;top:calc(100px + env(safe-area-inset-top,0px));width:min(290px,calc(100vw - 16px));box-sizing:border-box;background:var(--panel);border:1px solid rgba(128,128,128,.4);border-radius:10px;padding:8px;z-index:3;font-size:12px;max-height:62vh;overflow:auto}
#fp{left:8px}#fs{right:8px}#fp .r,#fs .r{display:flex;gap:6px;align-items:center;margin-top:4px;flex-wrap:wrap}#fp select,#fs select,#fs input{background:transparent;color:var(--fg);border:1px solid rgba(128,128,128,.4);border-radius:6px;padding:3px}
#pn{display:none;position:fixed;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100vw - 16px));background:var(--panel);border:1px solid rgba(128,128,128,.4);border-radius:10px;padding:10px;z-index:3;font-size:13px}
#pn textarea{width:100%;height:120px;box-sizing:border-box;font:12px monospace;background:transparent;color:var(--fg);border:1px solid rgba(128,128,128,.4);border-radius:6px}
#pn input{width:56px;background:transparent;color:var(--fg);border:1px solid rgba(128,128,128,.4);border-radius:6px;padding:3px}
#pn .r{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
</style></head><body>
<div id="ui">
<button id="bCut">剖面(矮牆)</button><button id="bRoof">屋頂</button><button id="bLab" class="on">標籤</button><button id="bFur" class="on">家具</button><button id="bVent" class="on">通風</button><button id="bMove">移動家具</button><button id="bRot">旋轉</button><button id="bFlip">翻轉門向</button><button id="bHinge">換鉸鍊側</button><button id="bBg">九宮</button><button id="bFs">風水指點</button><button id="bOpenAll">門窗全開</button><button id="bCloseAll">門窗全關</button><button id="bPaste">貼 HTML 到表面</button><button id="bAct">互動模式</button><button id="bTop">俯視</button><button id="bIso">斜視</button>
</div>
<div id="pn"><b>貼上 HTML 到點選的表面</b><textarea id="ta"></textarea><div class="r">寬<input id="iw" type="number" step="0.1" value="2">m 高<input id="ih" type="number" step="0.1" value="1">m</div><div class="r"><button id="bApply">套用</button><button id="bDel">刪除</button><button id="bClose">關閉</button></div><div style="opacity:.65;margin-top:6px">可含 input / button / 連結 / inline onclick。貼好後開「互動模式」才能操作面板（此時無法旋轉）。點已貼的面板可再編輯。</div></div>
<div id="sp"><div class="r">☀️ 時間 <input id="hr" type="range" min="6" max="19" step="0.05" value="14"><button id="bPlay">▶</button></div><div class="r"><span id="hv"></span></div>
<div class="r">🎨 牆色 <input id="wc" type="color" value="#f2ede4"><span id="sw" class="r" style="margin:0"></span></div>
<div class="r">💨 風向(來自) <input id="wd" type="range" min="0" max="359" value="225"><span id="wdv"></span></div>
<div class="r">風速 <input id="ws" type="range" min="0.3" max="4" step="0.1" value="1.5"><span id="wsv"></span></div>

<div id="fp"><b>家具 / 燈飾</b><div class="r"><select id="fcat"></select></div><div class="r"><button id="fAdd">新增</button><button id="fRep">替換選取</button><button id="fDup">複製</button><button id="fDel">刪除</button></div>

const S=86, H=2.8;

const hemi=new THREE.HemisphereLight(0xffffff,0x888899,.75);scene.add(hemi);
const dl=new THREE.DirectionalLight(0xffffff,.9);scene.add(dl);ren.shadowMap.enabled=true;ren.shadowMap.type=THREE.PCFSoftShadowMap;
dl.castShadow=true;dl.shadow.mapSize.set(2048,2048);dl.shadow.bias=-.0005;Object.assign(dl.shadow.camera,{left:-17,right:17,top:17,bottom:-17,near:1,far:120});

const M=c=>new THREE.MeshLambertMaterial({color:c});

function box(x0,x1,z0,z1,h0,h1,mat,g){
  const m=new THREE.Mesh(new THREE.BoxGeometry((x1-x0)/S,h1-h0,(z1-z0)/S),mat);
  m.position.set((X(x0)+X(x1))/2,(h0+h1)/2,(Z(z0)+Z(z1))/2);(g||scene).add(m);return m;}
const walls=new THREE.Group();scene.add(walls);const solids=[];

function setOp(op,open,instant){
  op.open=open;
  for(const l of op.leaves){l.tgt=open?op.flip*l.sign*1.4:0;if(instant)l.cur=l.tgt;l.g.rotation.y=l.base+l.cur;}
  const i=solids.indexOf(op.rect);
  if(open&&i>=0)solids.splice(i,1);
  if(!open&&i<0)solids.push(op.rect);
}
function build(op){
  for(const l of op.leaves)scene.remove(l.g);op.leaves=[];
  const{d,f,s,e,ty}=op,wm=(e-s)/S,n=wm>1.5?2:1,len=wm/n,isD=ty=='d',h0=isD?0:.9,hh=2.1-h0;
  for(let k=0;k<n;k++){
    const g=new THREE.Group(),st=(k==0)!==op.hs,hp=st?s:e;
    g.position.set(d=='h'?X(hp):X(f),h0,d=='h'?Z(f):Z(hp));
    const m=new THREE.Mesh(new THREE.BoxGeometry(len,hh,isD?.05:.03),isD?mDoor:mGlass);
    m.position.set((st?1:-1)*len/2,hh/2,0);m.userData.op=op;m.castShadow=isD;g.add(m);scene.add(g);
    op.leaves.push({g,base:d=='h'?0:-Math.PI/2,sign:st?1:-1,cur:0,tgt:0});
  }

}
function mkOp(d,f,s,e,ty,cfg){
  const isD=ty=='d',op={d,f,s,e,ty,leaves:[],rect:d=='h'?[s,e,f-8,f+8]:[f-8,f+8,s,e],open:!isD,flip:cfg&&cfg.flip||1,hs:!!(cfg&&cfg.hs),
    cx:d=='h'?(X(s)+X(e))/2:X(f),cz:d=='h'?Z(f):(Z(s)+Z(e))/2};
  openings.push(op);build(op);
}

// dir 'h': along x at y=f ; 'v': along y at x=f
function wall(d,f,a,b,ops=[]){
  const t=8;
  const seg=(s,e,h0,h1,mat=mWall)=>{ if(e-s<1)return; if(h0==0&&h1==H)solids.push(d=='h'?[s,e,f-t,f+t]:[f-t,f+t,s,e]);
    d=='h'?box(s,e,f-t,f+t,h0,h1,mat,walls):box(f-t,f+t,s,e,h0,h1,mat,walls);};
  let c=a;ops.sort((p,q)=>p[0]-q[0]);
  for(const [s,e,ty,cfg] of ops){
    seg(c,s,0,H);
    if(ty=='d'){seg(s,e,2.1,H);}
    else{seg(s,e,0,.9);seg(s,e,2.1,H);
      }
    mkOp(d,f,s,e,ty,cfg);c=e;}
  seg(c,b,0,H);
}

function label(t1,t2,px,pz,y=1.6){

const furn=new THREE.Group();scene.add(furn);let cur=furn;function G(k){cur=new THREE.Group();if(k)cur.userData.kind=k;furn.add(cur);}
const MC={},mat=c=>MC[c]||(MC[c]=M(c));

function F(cx,cz,w,d,h,c,y0=0){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(X(cx),.05+y0+h/2,Z(cz));cur.add(m);}
function Cy(cx,cz,r,h,c,y0=0){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,16),mat(c));m.position.set(X(cx),.05+y0+h/2,Z(cz));cur.add(m);}

  const dc=[X(955),Z(1700)];

  const se=furn.children.some(g=>g.userData.light&&secPx(g.position.x*S+726,g.position.z*S+416)==3);
  R(se,'東南(巽・財位)方'+(se?'已有燈光，旺財':'無燈：可在東南角放燈或綠植'));
  R(null,'<span style="opacity:.6">傳統文化參考，非科學依據；命卦以出生年簡算（未區分立春）。</span>');
  document.getElementById('fsout').innerHTML=o.join('');
}
document.getElementById('bFsGo').onclick=analyze;
tog('bFs',v=>{document.getElementById('fs').style.display=v?'block':'none';if(v)analyze();});
// 九宮格疊圖
const fsG=new THREE.Group();fsG.visible=false;scene.add(fsG);
const BGU=[['乾','貴人','#d0d0d8'],['坎','事業','#7fb4ff'],['艮','知識','#c9a97a'],['兌','子女','#fff08a'],['中','健康','#f2d675'],['震','家庭','#8fd68f'],['坤','感情','#f4a6c0'],['離','名聲','#ff9c8a'],['巽','財運','#6fe0b8']];
function spr(t1,t2,x,z,y){const c=document.createElement('canvas');c.width=256;c.height=128;const g=c.getContext('2d');g.fillStyle='rgba(255,255,255,.85)';g.fillRect(8,8,240,112);
  g.textAlign='center';g.fillStyle='#222';g.font='bold 48px sans-serif';g.fillText(t1,128,64);g.font='36px sans-serif';g.fillText(t2,128,106);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));s.scale.set(1.4,.7,1);s.position.set(x,y,z);s.renderOrder=9;fsG.add(s);}
const CS=5.5,w2=(lx,lz)=>[cx0+.7071*lx-.7071*lz,cz0+.7071*lx+.7071*lz];
BGU.forEach((b,i)=>{const lx=(i%3-1)*CS,lz=(Math.floor(i/3)-1)*CS,[wx,wz]=w2(lx,lz);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(CS-.1,CS-.1),new THREE.MeshBasicMaterial({color:b[2],transparent:true,opacity:.38,depthWrite:false,side:THREE.DoubleSide}));
  m.rotation.set(-Math.PI/2,0,0);m.rotateOnWorldAxis(new THREE.Vector3(0,1,0),-Math.PI/4);m.position.set(wx,.13,wz);m.raycast=()=>{};fsG.add(m);
  spr(b[0],b[1],wx,wz,.6);});
{const[nx,nz]=w2(0,-CS*1.5-1);spr('北 N','',nx,nz,.8);}
tog('bBg',v=>fsG.visible=v);
scene.traverse(o=>{if(o.isMesh&&o.material!==mGlass&&o.parent!==roof){o.castShadow=o.receiveShadow=true;}});

// ---- CSS3DRenderer：可互動 HTML 面板 ----
const crn=new THREE.CSS3DRenderer();crn.setSize(innerWidth,innerHeight);
crn.domElement.id='css';document.body.appendChild(crn.domElement);
const PX=200; // 1 m = 200 CSS px
const pn=document.getElementById('pn'),ta=document.getElementById('ta'),iw=document.getElementById('iw'),ih=document.getElementById('ih');
const DEF='<div style="width:100%;height:100%;box-sizing:border-box;background:#fffbe6;border:6px solid #c0392b;padding:12px;font:18px sans-serif;color:#222"><b>Hello 3D</b><br><input placeholder="可輸入文字" style="width:80%;margin:6px 0"><br><button onclick="this.textContent=\'OK!\'">按我</button></div>';
const decals=[],ZV=new THREE.Vector3(0,0,1);
let sel=null,hit=null,editing=false,dn=null;
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();
const cv=ren.domElement,bAct=document.getElementById('bAct'),bPaste=document.getElementById('bPaste');
tog('bPaste',v=>{editing=v;if(v){cv.style.pointerEvents='auto';bAct.classList.remove('on');}else pn.style.display='none';});
tog('bAct',v=>{cv.style.pointerEvents=v?'none':'auto';if(v){editing=false;bPaste.classList.remove('on');pn.style.display='none';}});
cv.addEventListener('pointerdown',e=>dn=[e.clientX,e.clientY]);
cv.addEventListener('pointerup',e=>{
  if(!editing||!dn||Math.hypot(e.clientX-dn[0],e.clientY-dn[1])>5)return;
  mv.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mv,cam);
  const h=ray.intersectObjects(scene.children,true).find(i=>i.object.isMesh&&i.object.material!==mGlass&&i.object.parent!==roof);
  if(!h)return;
  const d=h.object.userData.decal;
  if(d){sel=d;hit=null;ta.value=d.html;iw.value=d.w;ih.value=d.h;}
  else{const n=h.face.normal.clone();hit={p:h.point.clone().addScaledVector(n,.012),n};sel=null;ta.value=DEF;}
  pn.style.display='block';
});
document.getElementById('bClose').onclick=()=>pn.style.display='none';
document.getElementById('bDel').onclick=()=>{
  if(sel){scene.remove(sel.obj,sel.hole);sel.el.remove();decals.splice(decals.indexOf(sel),1);sel=null;}
  pn.style.display='none';};
document.getElementById('bApply').onclick=()=>{
  const html=ta.value,w=+iw.value||2,h=+ih.value||1;
  let d=sel;
  if(!d){
    if(!hit)return;
    const el=document.createElement('div');
    const obj=new THREE.CSS3DObject(el);obj.scale.setScalar(1/PX);
    // 透明「洞」：擋住 WebGL 的牆面，讓後面的 CSS 層透出來，同時保留牆對其他面板的遮擋
    const hole=new THREE.Mesh(new THREE.PlaneGeometry(1,1),
      new THREE.MeshBasicMaterial({color:0x000000,opacity:0,transparent:true,blending:THREE.NoBlending,side:THREE.DoubleSide}));
    hole.renderOrder=5;
    [obj,hole].forEach(o=>{o.quaternion.setFromUnitVectors(ZV,hit.n);o.position.copy(hit.p);});
    scene.add(obj,hole);
    d={el,obj,hole};hole.userData.decal=d;decals.push(d);sel=d;hit=null;
  }
  d.html=html;d.w=w;d.h=h;
  d.el.style.cssText='width:'+w*PX+'px;height:'+h*PX+'px;overflow:auto;box-sizing:border-box';
  d.el.innerHTML=html;
  d.hole.scale.set(w,h,1);
};
(function loop(){requestAnimationFrame(loop);ctl.update();simStep();ren.render(scene,cam);crn.render(scene,cam)})();
