#sp{position:fixed;left:8px;bottom:calc(32px + env(safe-area-inset-bottom,0px));width:min(310px,calc(100vw - 16px));box-sizing:border-box;background:var(--panel);border:1px solid rgba(128,128,128,.4);border-radius:10px;padding:8px;z-index:3;font-size:12px}
#sp .r{display:flex;gap:6px;align-items:center;margin-top:4px;flex-wrap:wrap}#sp input[type=range]{width:120px}
#pn{display:none;position:fixed;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));width:min(340px,calc(100vw - 16px));background:var(--panel);border:1px solid rgba(128,128,128,.4);border-radius:10px;padding:10px;z-index:3;font-size:13px}
#pn textarea{width:100%;height:120px;box-sizing:border-box;font:12px monospace;background:transparent;color:var(--fg);border:1px solid rgba(128,128,128,.4);border-radius:6px}
#pn input{width:56px;background:transparent;color:var(--fg);border:1px solid rgba(128,128,128,.4);border-radius:6px;padding:3px}
#pn .r{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
</style></head><body>
<div id="ui">
<button id="bCut">剖面(矮牆)</button><button id="bRoof">屋頂</button><button id="bLab" class="on">標籤</button><button id="bFur" class="on">家具</button><button id="bVent" class="on">通風</button><button id="bMove">移動家具</button><button id="bRot">旋轉</button><button id="bOpenAll">門窗全開</button><button id="bCloseAll">門窗全關</button><button id="bPaste">貼 HTML 到表面</button><button id="bAct">互動模式</button><button id="bTop">俯視</button><button id="bIso">斜視</button>
</div>
<div id="pn"><b>貼上 HTML 到點選的表面</b><textarea id="ta"></textarea><div class="r">寬<input id="iw" type="number" step="0.1" value="2">m 高<input id="ih" type="number" step="0.1" value="1">m</div><div class="r"><button id="bApply">套用</button><button id="bDel">刪除</button><button id="bClose">關閉</button></div><div style="opacity:.65;margin-top:6px">可含 input / button / 連結 / inline onclick。貼好後開「互動模式」才能操作面板（此時無法旋轉）。點已貼的面板可再編輯。</div></div>
<div id="sp"><div class="r">☀️ 時間 <input id="hr" type="range" min="6" max="19" step="0.05" value="14"><button id="bPlay">▶</button></div><div class="r"><span id="hv"></span></div>
<div class="r">🎨 牆色 <input id="wc" type="color" value="#f2ede4"><span id="sw" class="r" style="margin:0"></span></div>
<div class="r">💨 風向(來自) <input id="wd" type="range" min="0" max="359" value="225"><span id="wdv"></span></div>
<div class="r">風速 <input id="ws" type="range" min="0.3" max="4" step="0.1" value="1.5"><span id="wsv"></span></div>
<div style="opacity:.65;margin-top:4px">粒子：藍=低處冷空氣，橙=室內受熱上升（對流）。簡化模擬，非 CFD。</div></div>

function mkOp(d,f,s,e,ty){
  const wm=(e-s)/S,n=wm>1.5?2:1,len=wm/n,isD=ty=='d',h0=isD?0:.9,hh=2.1-h0;

    const m=new THREE.Mesh(new THREE.BoxGeometry(len,hh,isD?.05:.03),isD?mDoor:mGlass);

}

// dir 'h': along x at y=f ; 'v': along y at x=f
function wall(d,f,a,b,ops=[]){
  const t=8;

    d=='h'?box(s,e,f-t,f+t,h0,h1,mat,walls):box(f-t,f+t,s,e,h0,h1,mat,walls);};
  let c=a;ops.sort((p,q)=>p[0]-q[0]);
  for(const [s,e,ty] of ops){
    seg(c,s,0,H);
    if(ty=='d'){seg(s,e,2.1,H);}
    else{seg(s,e,0,.9);seg(s,e,2.1,H);
      }
    mkOp(d,f,s,e,ty);c=e;}
  seg(c,b,0,H);
}

function F(cx,cz,w,d,h,c,y0=0){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(X(cx),.05+y0+h/2,Z(cz));cur.add(m);}

const hr=document.getElementById('hr'),hv=document.getElementById('hv'),tgt=new THREE.Vector3(2.5,0,10.6);

function sun(){
  const h=+hr.value,a=Math.PI*(h-6)/12,sa=Math.sin(a),ca=Math.cos(a);
  const v=new THREE.Vector3(.7071*ca-.1343*sa,Math.max(.02,sa*.98),.7071*ca+.1343*sa).normalize();

  dl.color.setRGB(1,.75+.25*Math.max(0,sa),.55+.45*Math.max(0,sa));sunY=Math.max(0,sa);

  hv.textContent=String(hh).padStart(2,'0')+':'+String(mm%60).padStart(2,'0')+'  高度'+Math.round(Math.asin(v.y)*180/Math.PI)+'°';

const blocked=(x,z)=>{for(const r of solids)if(x>r[0]&&x<r[1]&&z>r[2]&&z<r[3])return true;return false;};
let wdir=225,wspd=1.5,wvx=0,wvz=0;const R=1300,CX=1067,CZ=1075;
const arrow=new THREE.ArrowHelper(new THREE.Vector3(1,0,0),new THREE.Vector3(),6,0x2f6fed,1.2,.7);scene.add(arrow);
function spawn(q,init){
  const s=init?(Math.random()*2-1)*R:-R,o=(Math.random()-.5)*1500;
  q.x=CX+wvx*s-wvz*o;q.z=CZ+wvz*s+wvx*o;q.y=.3+Math.random()*2.2;q.age=init?Math.random()*20:0;}
function wind(){
  const b=wdir*Math.PI/180;
  wvx=-(.7071*Math.cos(b)+.7071*Math.sin(b));wvz=-(-.7071*Math.cos(b)+.7071*Math.sin(b));
  for(const q of PQ)spawn(q,true);
  arrow.setDirection(new THREE.Vector3(wvx,0,wvz));
  arrow.position.set(X(CX)-wvx*13,4,Z(CZ)-wvz*13);
  document.getElementById('wdv').textContent=wdir+'° '+['北','東北','東','東南','南','西南','西','西北'][Math.round(wdir/45)%8]+'風';
  document.getElementById('wsv').textContent=wspd+' m/s';}
for(let i=0;i<NP;i++)PQ.push({});
document.getElementById('wd').oninput=e=>{wdir=+e.target.value;wind();};
document.getElementById('ws').oninput=e=>{wspd=+e.target.value;wind();};
wind();
tog('bVent',v=>{pts.visible=v;arrow.visible=v;});
let lastT=performance.now();
function simStep(){
  const now=performance.now(),dt=Math.min(.05,(now-lastT)/1000);lastT=now;
  for(const op of openings)for(const l of op.leaves){l.cur+=(l.tgt-l.cur)*Math.min(1,dt*8);l.g.rotation.y=l.base+l.cur;}
  if(!pts.visible)return;
  const sp=wspd*S,buoy=.12+.55*sunY;
  for(let i=0;i<NP;i++){
    const q=PQ[i];q.age+=dt;
    let dx=(wvx*sp+(Math.random()-.5)*sp*.6)*dt,dz=(wvz*sp+(Math.random()-.5)*sp*.6)*dt;
    const ind=q.x>726&&q.x<1408&&q.z>416&&q.z<1735;
    if(ind){dx*=.6;dz*=.6;}
    let nx=q.x+dx,nz=q.z+dz;
    if(blocked(nx,nz)){if(!blocked(nx,q.z))nz=q.z;else if(!blocked(q.x,nz))nx=q.x;else{nx=q.x;nz=q.z;}}
    q.x=nx;q.z=nz;
    if(ind){q.y+=buoy*dt;if(q.y>2.65)q.y=.25+Math.random()*.3;}
    if(q.age>40||(q.x-CX)*wvx+(q.z-CZ)*wvz>R+100)spawn(q,false);
    const t=ind?Math.min(1,q.y/2.7):0;
    pp[i*3]=X(q.x);pp[i*3+1]=q.y;pp[i*3+2]=Z(q.z);
    pc[i*3]=.3+.7*t;pc[i*3+1]=.65-.2*t;pc[i*3+2]=1-.8*t;
  }
  pg.attributes.position.needsUpdate=true;pg.attributes.color.needsUpdate=true;
}
// ---- 門窗開關 + 家具移動 ----
const rc=new THREE.Raycaster(),m2=new THREE.Vector2(),plane=new THREE.Plane(new THREE.Vector3(0,1,0),-.05),tmp=new THREE.Vector3();
let moving=false,drag=null,selG=null;
const bh=new THREE.BoxHelper(new THREE.Object3D(),0xffd400);bh.material.depthTest=false;bh.visible=false;scene.add(bh);
const vis=o=>{while(o){if(!o.visible)return false;o=o.parent;}return true;};
const ptr=e=>{m2.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);rc.setFromCamera(m2,cam);};
const pieceOf=o=>{while(o&&o.parent&&o.parent!==furn)o=o.parent;return o&&o.parent===furn?o:null;};
const firstHit=()=>rc.intersectObjects(scene.children,true).find(i=>i.object.isMesh&&i.object.parent!==roof&&!i.object.userData.decal&&vis(i.object));
tog('bMove',v=>{moving=v;if(v){editing=false;pn.style.display='none';cv.style.pointerEvents='auto';bPaste.classList.remove('on');bAct.classList.remove('on');}else{bh.visible=false;selG=null;}});
ren.domElement.addEventListener('pointerdown',e=>{
  if(!moving||editing)return;
  ptr(e);const h=firstHit();if(!h)return;
  const g=pieceOf(h.object);if(!g)return;
  e.stopImmediatePropagation();ctl.enabled=false;selG=g;
  rc.ray.intersectPlane(plane,tmp);drag={dx:g.position.x-tmp.x,dz:g.position.z-tmp.z};
  bh.setFromObject(g);bh.visible=true;
},true);
addEventListener('pointermove',e=>{
  if(!drag)return;ptr(e);if(!rc.ray.intersectPlane(plane,tmp))return;
  selG.position.x=Math.round((tmp.x+drag.dx)/.05)*.05;selG.position.z=Math.round((tmp.z+drag.dz)/.05)*.05;bh.setFromObject(selG);});
addEventListener('pointerup',()=>{if(drag){drag=null;ctl.enabled=true;}});
const rot=()=>{if(selG){selG.rotation.y+=Math.PI/2;bh.setFromObject(selG);}};
document.getElementById('bRot').onclick=rot;
addEventListener('keydown',e=>{if((e.key=='r'||e.key=='R')&&!/INPUT|TEXTAREA/.test(e.target.tagName))rot();});
ren.domElement.addEventListener('pointerup',e=>{
  if(editing||moving||!dn||Math.hypot(e.clientX-dn[0],e.clientY-dn[1])>5)return;
  ptr(e);const h=firstHit();
  if(h&&h.object.userData.op){const op=h.object.userData.op;setOp(op,!op.open);}
});
document.getElementById('bOpenAll').onclick=()=>openings.forEach(o=>setOp(o,true));
document.getElementById('bCloseAll').onclick=()=>openings.forEach(o=>setOp(o,false));
scene.traverse(o=>{if(o.isMesh&&o.material!==mGlass&&o.parent!==roof){o.castShadow=o.receiveShadow=true;}});

// ---- CSS3DRenderer：可互動 HTML 面板 ----
const crn=new THREE.CSS3DRenderer();crn.setSize(innerWidth,innerHeight);
crn.domElement.id='css';document.body.appendChild(crn.domElement);
const PX=200; // 1 m = 200 CSS px
const pn=document.getElementById('pn'),ta=document.getElementById('ta'),iw=document.getElementById('iw'),ih=document.getElementById('ih');
const DEF='<div style="width:100%;height:100%;box-sizing:border-box;background:#fffbe6;border:6px solid #c0392b;padding:12px;font:18px sans-serif;color:#222"><b>Hello 3D</b><br><input placeholder="可輸入文字" style="width:80%;margin:6px 0"><br><button onclick="this.textContent=\'OK!\'">按我</button></div>';
const decals=[],ZV=new THREE.Vector3(0,0,1);
let sel=null,hit=null,editing=false,dn=null;
const ray=new THREE.Raycaster(),mv=new THREE.Vector2();
const cv=ren.domElement,bAct=document.getElementById('bAct'),bPaste=document.getElementById('bPaste');
tog('bPaste',v=>{editing=v;if(v){cv.style.pointerEvents='auto';bAct.classList.remove('on');}else pn.style.display='none';});
tog('bAct',v=>{cv.style.pointerEvents=v?'none':'auto';if(v){editing=false;bPaste.classList.remove('on');pn.style.display='none';}});
cv.addEventListener('pointerdown',e=>dn=[e.clientX,e.clientY]);
cv.addEventListener('pointerup',e=>{
  if(!editing||!dn||Math.hypot(e.clientX-dn[0],e.clientY-dn[1])>5)return;
  mv.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);ray.setFromCamera(mv,cam);
  const h=ray.intersectObjects(scene.children,true).find(i=>i.object.isMesh&&i.object.material!==mGlass&&i.object.parent!==roof);
  if(!h)return;
  const d=h.object.userData.decal;
  if(d){sel=d;hit=null;ta.value=d.html;iw.value=d.w;ih.value=d.h;}
  else{const n=h.face.normal.clone();hit={p:h.point.clone().addScaledVector(n,.012),n};sel=null;ta.value=DEF;}
  pn.style.display='block';
});
document.getElementById('bClose').onclick=()=>pn.style.display='none';
document.getElementById('bDel').onclick=()=>{
  if(sel){scene.remove(sel.obj,sel.hole);sel.el.remove();decals.splice(decals.indexOf(sel),1);sel=null;}
  pn.style.display='none';};
document.getElementById('bApply').onclick=()=>{
  const html=ta.value,w=+iw.value||2,h=+ih.value||1;
  let d=sel;
  if(!d){
    if(!hit)return;
    const el=document.createElement('div');
    const obj=new THREE.CSS3DObject(el);obj.scale.setScalar(1/PX);
    // 透明「洞」：擋住 WebGL 的牆面，讓後面的 CSS 層透出來，同時保留牆對其他面板的遮擋
    const hole=new THREE.Mesh(new THREE.PlaneGeometry(1,1),
      new THREE.MeshBasicMaterial({color:0x000000,opacity:0,transparent:true,blending:THREE.NoBlending,side:THREE.DoubleSide}));
    hole.renderOrder=5;
    [obj,hole].forEach(o=>{o.quaternion.setFromUnitVectors(ZV,hit.n);o.position.copy(hit.p);});
    scene.add(obj,hole);
    d={el,obj,hole};hole.userData.decal=d;decals.push(d);sel=d;hit=null;
  }
  d.html=html;d.w=w;d.h=h;
  d.el.style.cssText='width:'+w*PX+'px;height:'+h*PX+'px;overflow:auto;box-sizing:border-box';
  d.el.innerHTML=html;
  d.hole.scale.set(w,h,1);
};
(function loop(){requestAnimationFrame(loop);ctl.update();simStep();ren.render(scene,cam);crn.render(scene,cam)})();
</script></body></html>
